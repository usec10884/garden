<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族脈絡圖 - 瀏覽版</title>
    <style>
        :root {
            --male-bg: #e3f2fd; --male-border: #2196f3;
            --female-bg: #fff3e0; --female-border: #ff9800;
            --deceased-bg: #eeeeee; --deceased-text: #888;
            --line-color: #999; --card-width: 140px;
            --heart-color: #ff0000;
        }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; margin: 0; overflow: auto; }
        .title-container { position: fixed; top: 10px; left: 15px; z-index: 2000; }
        #fixed-title { font-size: 14px; font-weight: bold; color: #333; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; }
        .admin-controls { position: fixed; top: 10px; right: 10px; z-index: 2000; display: flex; gap: 5px; }
        .control-btn { padding: 5px 10px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; font-size: 12px; background: #555; }
        #zoom-outer { width: 100%; height: 100vh; overflow: auto; padding: 80px 50px; box-sizing: border-box; }
        #zoom-inner { transform-origin: top center; transition: transform 0.2s; }
        
        /* 樹狀結構線條 */
        .tree ul { padding-top: 30px; position: relative; display: flex; justify-content: center; margin: 0; padding-inline-start: 0; }
        .tree ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--line-color); height: 30px; transform: translateX(var(--drag-offset, 0px)); }
        .tree > ul::before { display: none; }
        .tree li { text-align: center; list-style-type: none; position: relative; padding: 30px 5px 0 5px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--line-color); width: 50%; height: 30px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line-color); }
        .tree li:only-child::before, .tree li:only-child::after { display: none; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid var(--line-color); border-radius: 0 8px 0 0; }
        .tree li:first-child::after { border-radius: 8px 0 0 0; }

        .node-container { display: inline-flex; align-items: flex-start; gap: 35px; position: relative; }
        .spouse-list { display: flex; gap: 35px; }
        .spouse-item { position: relative; }
        .spouse-item::before { content: "♥"; position: absolute; top: 10px; left: -32px; color: var(--heart-color); font-size: 28px; }

        .member-card { width: var(--card-width); padding: 10px; border-radius: 8px; border: 2px solid #ccc; background: white; position: relative; }
        .male { background-color: var(--male-bg); border-color: var(--male-border); }
        .female { background-color: var(--female-bg); border-color: var(--female-border); }
        .deceased { background-color: var(--deceased-bg) !important; color: var(--deceased-text) !important; }
        .name-row { font-weight: bold; font-size: 15px; display: block; margin-bottom: 5px; }
        .btn-direct { width: 100%; font-size: 11px; cursor: pointer; border: 1px solid #c2185b; background: #e91e63; color: white; padding: 4px 0; border-radius: 4px; font-weight: bold; }
        .not-direct-line { display: none !important; }
    </style>
</head>
<body>

    <div class="title-container">
        <div id="fixed-title">家族脈絡系統 (唯讀版)</div>
    </div>

    <div class="admin-controls">
        <button class="control-btn" onclick="changeZoom(-0.1)">➖</button>
        <button class="control-btn" onclick="setZoom(1)">100%</button>
        <button class="control-btn" onclick="changeZoom(0.1)">➕</button>
        <button class="control-btn" style="background:#2196f3; display:none;" onclick="resetFilter()" id="reset-btn">全圖</button>
    </div>

    <div id="zoom-outer">
        <div id="zoom-inner">
            <div class="tree" id="tree-container"></div>
        </div>
    </div>

,"memo":"","isDead":false,"spouses":[],"children":[]},{"id":"id_1767574425606","name":"l.jm","gender":"male","birthday":"","phone":"","email":"","address":"","memo":"","isDead":false,"spouses":[{"name":"54274cb","gender":"female","isDead":false,"isDivorced":false,"birthday":"","phone":"","address":""}],"children":[{"id":"id_1767574447838","name":"4242","gender":"male","birthday":"","phone":"","email":"","address":"","memo":"","isDead":false,"spouses":[],"children":[]},{"id":"id_1767604453585","name":"4585123","gender":"male","birthday":"","phone":"","email":"","address":"","memo":"","isDead":false,"spouses":[],"children":[]}]},{"id":"id_1767691789243","name":"vcbdb","gender":"male","birthday":"","phone":"","email":"","address":"","memo":"","isDead":false,"spouses":[],"children":[]}],"memo":""},{"id":"id_1767691798090","name":"jghjdyj","gender":"male","birthday":"","phone":"","email":"","address":"","memo":"","isDead":false,"spouses":[],"children":[]},{"id":"id_1767691803987","name":"l.kjh.bg","gender":"male","birthday":"","phone":"","email":"","address":"","memo":"","isDead":false,"spouses":[],"children":[]}],"memo":""}*/
        const hardcodedData = JSON.parse('在此貼上複製的文字，請確保前後有單引號');

        let currentZoom = 1;
        function changeZoom(d) { currentZoom = Math.max(0.2, Math.min(2, currentZoom + d)); applyZoom(); }
        function setZoom(v) { currentZoom = v; applyZoom(); }
        function applyZoom() { document.getElementById('zoom-inner').style.transform = `scale(${currentZoom})`; }

        function render() {
            document.getElementById('tree-container').innerHTML = `<ul>${genHtml(hardcodedData)}</ul>`;
        }

        function genHtml(m) {
            const hasSpouse = m.spouses && m.spouses.length > 0;
            const deadClass = m.isDead ? 'deceased' : '';
            const offsetStyle = hasSpouse ? `style="--drag-offset: -87.5px;"` : `style="--drag-offset: 0px;"`;
            let spouseHtml = (m.spouses || []).map(s => `
                <div class="spouse-item">
                    <div class="member-card ${s.gender} ${s.isDead ? 'deceased' : ''}">
                        <span class="name-row">${s.name}</span>
                    </div>
                </div>`).join('');
            return `<li id="li-${m.id}" data-node-id="${m.id}">
                <div class="node-container">
                    <div class="member-card ${m.gender} ${deadClass}">
                        <span class="name-row">${m.name}</span>
                        <button class="btn-direct" onclick="toggleDirectMode('${m.id}')">直系脈絡</button>
                    </div>${hasSpouse ? `<div class="spouse-list">${spouseHtml}</div>` : ''}
                </div>${m.children?.length ? `<ul ${offsetStyle}>${m.children.map(c => genHtml(c)).join('')}</ul>` : ''}</li>`;
        }

        function toggleDirectMode(id) {
            document.getElementById('reset-btn').style.display = 'block';
            const directIds = new Set();
            let cur = id;
            while(cur) { directIds.add(cur); const p = findParent(hardcodedData, cur); cur = p?p.id:null; }
            function collect(n) { directIds.add(n.id); (n.children||[]).forEach(collect); }
            collect(find(hardcodedData, id));
            document.querySelectorAll('.tree li').forEach(li => li.classList.toggle('not-direct-line', !directIds.has(li.dataset.nodeId)));
        }

        function resetFilter() { document.getElementById('reset-btn').style.display = 'none'; document.querySelectorAll('.not-direct-line').forEach(el => el.classList.remove('not-direct-line')); }
        function find(n, id) { if (n.id === id) return n; for (let c of (n.children || [])) { const r = find(c, id); if (r) return r; } return null; }
        function findParent(root, childId) { if (!root.children) return null; if (root.children.some(c => c.id === childId)) return root; for (let c of root.children) { const p = findParent(c, childId); if (p) return p; } return null; }

        render();
    </script>
</body>
</html>
